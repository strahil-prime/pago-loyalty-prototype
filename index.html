<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>PagoEfectivo Prototype</title>
<style>
  :root { --k: 1; }
  html, body { margin: 0; height: 100%; background: #111; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #phone { position: relative; overflow: hidden; background: #f8f8f8; width: calc(375px * var(--k)); height: calc(812px * var(--k)); }
  @media (min-width: 600px) { #phone { border-radius: calc(44px * var(--k)); box-shadow: 0 0 0 10px #2a2a2a, 0 30px 80px rgba(0,0,0,.6); } }
  .screen { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #f8f8f8; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen .content { position: relative; width: 100%; }
  .screen img.bg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .hs { position: absolute; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: calc(10px * var(--k)); }
  .fixed { position: absolute; left: 0; right: 0; background-repeat: no-repeat; background-size: 100% auto; z-index: 5; }
  .fixed.top { top: 0; background-position: top center; pointer-events: none; }
  .fixed.bottom { bottom: 0; background-position: bottom center; }
  .flash .hs { background: rgba(0, 122, 255, .18); outline: 2px solid rgba(0, 122, 255, .55); transition: background .1s; }
  /* Each .view is one whole screen (status bar, scroll area, fixed bars) and moves as one piece. */
  #phone { isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); }
  .view { position: absolute; inset: 0; overflow: hidden; background: #f8f8f8; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .view.moving { will-change: transform; }
  .view.edge { box-shadow: -6px 0 24px rgba(0,0,0,.16); }
  .view .dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9; }
  .view.overlay { pointer-events: none; z-index: 20; }
  /* One status bar for the whole phone, above every screen, so it never slides or doubles up. */
  #sb { position: absolute; left: 0; right: 0; top: 0; z-index: 30; pointer-events: none; }
  #sb .l { position: absolute; inset: 0; background-repeat: no-repeat; background-size: 100% auto; background-position: top center; }
</style>
</head>
<body>
<div id="phone" aria-live="polite"></div>
<script>
// Hotspot coordinates are in Figma points (screen width 375). `foot` = fixed footer crop
// (height from the bottom of the frame) whose hotspots are relative to the footer's top.
const TABS = h => ({ h, hs: [
  { r: [0, 0, 75, h], go: 'home', mode: 'tab' }, { r: [75, 0, 75, h] }, { r: [150, 0, 75, h] },
  { r: [225, 0, 75, h], go: 'puntos', mode: 'tab' }, { r: [300, 0, 75, h], go: 'stores', mode: 'tab' } ] });
const BTN = (h, spec) => ({ h, hs: [ { r: [16, h - 98, 343, 52], ...spec } ] });
const BACK = { r: [4, 44, 64, 52], back: true };
const CLOSE = { r: [8, 54, 64, 60], back: true };
const S = {
  home: { img: 'home', h: 812, foot: TABS(83), hs: [
    { r: [148, 208, 80, 116], go: 'cip_code' },
    { r: [16, 343, 311, 148], go: 'puntos', mode: 'tab' },
    { r: [292, 508, 80, 34], go: 'home_tx' } ] },
  home_tx: { img: 'home_tx', h: 813, hs: [ BACK, { r: [16, 198, 343, 74], go: 'home_tx_detail', mode: 'sheet' } ] },
  home_tx_detail: { img: 'home_tx_detail', h: 813, hs: [ { r: [8, 64, 64, 60], back: true } ] },
  puntos: { img: 'puntos', h: 1558, foot: TABS(81), hs: [
    { r: [320, 40, 52, 52], go: 'howitworks', mode: 'sheet' },
    { r: [60, 174, 133, 30], go: 'canjear' },
    { r: [193, 174, 122, 30], go: 'premios_excl' },
    { r: [24, 218, 108, 116], go: 'canjear' },
    { r: [134, 218, 108, 116], go: 'premios_todos' },
    { r: [244, 218, 108, 116], go: 'act' },
    { r: [16, 780, 343, 120], go: 'challenge', mode: 'sheet' } ] },
  howitworks: { img: 'howitworks', h: 978, foot: BTN(114, { back: true }), hs: [ CLOSE ] },
  challenge: { img: 'challenge', h: 812, foot: BTN(114, { back: true }), hs: [ CLOSE ] },
  canjear: { img: () => state.joined ? 'canjear_joined' : 'canjear', h: 985, hs: [
    BACK, { r: [16, 610, 343, 98], go: () => state.joined ? 'sorteo_joined' : 'sorteo', mode: 'sheet' } ] },
  sorteo: { img: 'sorteo', h: 812, foot: BTN(114, { act: () => { state.joined = true; replace('sorteo_joined', 'fade'); } }), hs: [ CLOSE ] },
  sorteo_joined: { img: 'sorteo_joined', h: 812, hs: [ CLOSE ] },
  premios_todos: { img: () => state.joined ? 'premios_todos_joined' : 'premios_todos', h: 1684, hs: [
    BACK,
    { r: [132, 148, 112, 48], go: 'premios_excl', mode: 'replace' },
    { r: [246, 148, 116, 48], go: 'premios_canj', mode: 'replace' },
    { r: [10, 421, 355, 94], go: 'canjear' },
    { r: [10, 524, 355, 76], go: 'temu_detail', mode: 'sheet' },
    { r: [10, 1074, 355, 98], go: () => state.joined ? 'sorteo_joined' : null, mode: 'sheet' } ] },
  premios_excl: { img: 'premios_excl', h: 812, hs: [
    BACK,
    { r: [16, 148, 112, 48], go: 'premios_todos', mode: 'replace' },
    { r: [248, 148, 112, 48], go: 'premios_canj', mode: 'replace' },
    { r: [16, 261, 343, 72], go: 'temu_detail', mode: 'sheet' },
    { r: [16, 521, 343, 72], act: () => showToast() } ] },
  premios_canj: { img: 'premios_canj', h: 1280, hs: [
    BACK,
    { r: [16, 148, 112, 48], go: 'premios_todos', mode: 'replace' },
    { r: [132, 148, 112, 48], go: 'premios_excl', mode: 'replace' },
    { r: [16, 1000, 343, 94], go: 'code_fifa', mode: 'sheet' } ] },
  temu_detail: { img: 'temu_detail', h: 812, foot: BTN(114, { back: true }), hs: [ CLOSE ] },
  code_fifa: { img: 'code_fifa', h: 812, foot: BTN(114, { back: true }), hs: [ CLOSE ] },
  stores: { img: 'stores', h: 812, foot: TABS(83), hs: [
    { r: [292, 176, 80, 36], go: 'premios_excl' },
    { r: [16, 218, 314, 148], go: 'premios_excl' } ] },
  act: { img: 'act', h: 812, hs: [ BACK, { r: [16, 368, 343, 74], go: 'act_detail', mode: 'sheet' } ] },
  act_detail: { img: 'act_detail', h: 812, hs: [ CLOSE ] },
  cip_code: { img: 'cip_code', h: 813, hs: [ BACK, { r: [16, 462, 343, 48], go: 'checkout' } ] },
  checkout: { img: () => 'checkout_' + state.sel, h: 891, foot: { h: 110, hs: [ { r: [16, 16, 343, 50], go: 'review' } ] }, hs: [
    BACK,
    { r: [16, 335, 166, 72], act: () => select('0') },
    { r: [192, 335, 166, 72], act: () => select('10') },
    { r: [16, 417, 166, 72], act: () => select('20') } ] },
  review: { img: () => 'review_' + state.sel, h: 888, foot: { h: 110, hs: [ { r: [16, 16, 343, 50], go: 'success' } ] }, hs: [ BACK ] },
  success: { img: () => 'success_' + state.sel, h: 813, foot: { h: 110, hs: [ { r: [16, 16, 343, 50], act: () => reset('home') } ] }, hs: [] },
};
const state = { joined: false, sel: '20' };
const stack = [];
const phone = document.getElementById('phone');
const val = v => typeof v === 'function' ? v() : v;

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const desk = vw >= 600;
  const k = desk ? Math.min((vw - 40) / 375, (vh - 40) / 812) : Math.min(vw, 480) / 375;
  document.documentElement.style.setProperty('--k', k);
  phone.style.height = desk ? '' : vh + 'px';
}
window.addEventListener('resize', fit);

function px(n) { return `calc(${n}px * var(--k))`; }
function hotspot(h, parent) {
  const b = document.createElement('button');
  b.className = 'hs'; b.setAttribute('aria-label', h.go ? String(val(h.go) || '') : 'acción');
  const [x, y, w, hh] = h.r;
  Object.assign(b.style, { left: px(x), top: px(y), width: px(w), height: px(hh) });
  if (!h.go && !h.back && !h.act) { b.style.cursor = 'default'; b.dataset.noop = '1'; }
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (h.act) return h.act();
    if (h.back) return back();
    const target = val(h.go); if (!target) return flash();
    if (h.mode === 'tab') return reset(target);
    if (h.mode === 'replace') return replace(target, 'fade');
    if (h.mode === 'none') return;
    push(target, h.mode === 'sheet' ? 'sheet' : 'push');
  });
  parent.appendChild(b);
}
const EASE = 'cubic-bezier(.32,.72,0,1)';   // iOS navigation curve
const T = { push: 420, pop: 380, sheet: 460, sheetDown: 380, fade: 200 };
let busy = false;
const views = [];                              // navigation stack of live .view elements
const top_ = () => views[views.length - 1];

function build(name) {
  const def = S[name]; const img = val(def.img);
  const v = document.createElement('div'); v.className = 'view'; v.dataset.name = name; v.dataset.img = img;
  const sc = document.createElement('div'); sc.className = 'screen';
  const c = document.createElement('div'); c.className = 'content';
  const im = document.createElement('img'); im.className = 'bg'; im.src = `img/${img}.webp`; im.alt = ''; im.decoding = 'sync';
  c.appendChild(im); def.hs.forEach(h => hotspot(h, c)); sc.appendChild(c); v.appendChild(sc);
  if (def.foot) {
    const f = document.createElement('div'); f.className = 'fixed bottom';
    f.style.backgroundImage = `url(img/${img}.webp)`; f.style.height = px(def.foot.h);
    def.foot.hs.forEach(h => hotspot(h, f)); v.appendChild(f);
  }
  const d = document.createElement('div'); d.className = 'dim'; v.appendChild(d);
  v.addEventListener('click', flash);
  return v;
}
// Wait until the screen image is decoded so nothing slides in blank.
function ready(v) {
  const im = v.querySelector('img.bg');
  return Promise.race([im.decode ? im.decode().catch(() => {}) : Promise.resolve(), new Promise(r => setTimeout(r, 500))]);
}
function anim(el, kf, dur) { return el.animate(kf, { duration: dur, easing: EASE, fill: 'both' }).finished.catch(() => {}); }
function settle(v) { v.getAnimations({ subtree: true }).forEach(a => a.cancel()); v.classList.remove('moving', 'edge'); }
const dimOf = v => v.querySelector(':scope > .dim');
const sb = document.createElement('div'); sb.id = 'sb'; sb.style.height = px(44); phone.appendChild(sb);
function setSB(img, dur) {
  const cur = sb.lastElementChild; if (cur && cur.dataset.img === img) return;
  const l = document.createElement('div'); l.className = 'l'; l.dataset.img = img; l.style.backgroundImage = `url(img/${img}.webp)`;
  sb.appendChild(l);
  if (!dur || !cur) { [...sb.children].forEach(c => c !== l && c.remove()); return; }
  l.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, easing: 'ease' }).finished.then(() => [...sb.children].forEach(c => c !== l && c.remove())).catch(() => {});
}
const clipTop = () => `inset(calc(44px * var(--k)) 0 0 0)`;
function mark(name) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }

// Refresh a kept view whose image depends on state (e.g. after joining a sweepstake).
async function refresh(v) {
  const img = val(S[v.dataset.name].img); if (img === v.dataset.img) return;
  const pre = new Image(); pre.src = `img/${img}.webp`; try { await pre.decode(); } catch (e) {}
  v.dataset.img = img;
  v.querySelector('img.bg').src = pre.src;
  v.querySelectorAll('.fixed').forEach(f => f.style.backgroundImage = `url(img/${img}.webp)`);
  if (v === top_()) setSB(img, T.fade);
}

async function push(name, mode) {
  if (busy) return; busy = true;
  const from = top_(); const v = build(name); v.dataset.mode = mode;
  v.style.visibility = 'hidden'; phone.appendChild(v); await ready(v);
  from.classList.add('moving'); v.classList.add('moving');
  v.style.visibility = '';
  if (mode === 'sheet') {
    v.style.clipPath = clipTop();
    await Promise.all([anim(v, [{ transform: 'translateY(100%)' }, { transform: 'none' }], T.sheet),
                       anim(dimOf(from), [{ opacity: 0 }, { opacity: .3 }], T.sheet)]);
    setSB(v.dataset.img, 160); v.style.clipPath = '';
  } else {
    v.classList.add('edge'); setSB(v.dataset.img, T.push);
    await Promise.all([anim(v, [{ transform: 'translateX(100%)' }, { transform: 'none' }], T.push),
                       anim(from, [{ transform: 'none' }, { transform: 'translateX(-30%)' }], T.push),
                       anim(dimOf(from), [{ opacity: 0 }, { opacity: .12 }], T.push)]);
  }
  settle(from); settle(v); from.style.visibility = 'hidden';
  views.push(v); mark(name); busy = false;
}
async function back() {
  if (busy || views.length < 2) return; busy = true;
  const v = views.pop(); const to = top_();
  await refresh(to);
  to.classList.add('moving'); v.classList.add('moving');
  if (v.dataset.mode === 'sheet') {
    dimOf(to).style.opacity = .3; to.style.visibility = '';
    v.style.clipPath = clipTop(); setSB(to.dataset.img, 160);
    await Promise.all([anim(v, [{ transform: 'none' }, { transform: 'translateY(100%)' }], T.sheetDown),
                       anim(dimOf(to), [{ opacity: .3 }, { opacity: 0 }], T.sheetDown)]);
  } else {
    v.classList.add('edge'); setSB(to.dataset.img, T.pop);
    to.style.transform = 'translateX(-30%)'; to.style.visibility = '';
    await Promise.all([anim(v, [{ transform: 'none' }, { transform: 'translateX(100%)' }], T.pop),
                       anim(to, [{ transform: 'translateX(-30%)' }, { transform: 'none' }], T.pop),
                       anim(dimOf(to), [{ opacity: .12 }, { opacity: 0 }], T.pop)]);
  }
  to.style.transform = ''; dimOf(to).style.opacity = '';
  v.remove(); settle(to); mark(to.dataset.name); busy = false;
}
// Swap the current screen in place (chips, sweepstake joined) with a quick cross-fade.
async function replace(name) {
  if (busy) return; busy = true;
  const from = top_(); const v = build(name); v.dataset.mode = from.dataset.mode || 'push';
  v.style.visibility = 'hidden'; phone.appendChild(v); await ready(v); v.style.visibility = '';
  setSB(v.dataset.img, T.fade);
  await anim(v, [{ opacity: 0 }, { opacity: 1 }], T.fade);
  settle(v); from.remove(); views[views.length - 1] = v; mark(name); busy = false;
}
// Tab bar: start a fresh stack.
async function reset(name, instant) {
  if (busy) return; busy = true;
  const v = build(name); v.style.visibility = 'hidden'; phone.appendChild(v); await ready(v); v.style.visibility = '';
  setSB(v.dataset.img, instant ? 0 : T.fade);
  if (!instant) await anim(v, [{ opacity: 0 }, { opacity: 1 }], T.fade);
  settle(v); [...phone.querySelectorAll('.view')].forEach(o => o !== v && o.remove());
  views.length = 0; views.push(v); mark(name); busy = false;
}
async function select(s) {
  if (busy || state.sel === s) return; state.sel = s; await refresh(top_());
}
let toastOn = false;
// "No disponible" pill drops in under the status bar, wherever the list is scrolled.
async function showToast() {
  if (toastOn) return; toastOn = true;
  const t = document.createElement('img'); t.src = 'img/toast_pill.webp'; t.alt = 'No disponible';
  Object.assign(t.style, { position: 'absolute', zIndex: 25, pointerEvents: 'none', left: px(115), top: px(50), width: px(145), height: px(40),
    borderRadius: px(20), boxShadow: '0 4px 14px rgba(0,0,0,.16)' });
  phone.appendChild(t);
  try { await t.decode(); } catch (e) {}
  await t.animate([{ opacity: 0, transform: 'translateY(-14px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: EASE, fill: 'both' }).finished;
  await new Promise(r => setTimeout(r, 1800));
  await t.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 260, easing: 'ease-in', fill: 'both' }).finished;
  t.remove(); toastOn = false;
}
let flashT;
function flash() { phone.classList.add('flash'); clearTimeout(flashT); flashT = setTimeout(() => phone.classList.remove('flash'), 450); }

// Preload and decode every image so transitions never wait on the network.
['home','puntos','canjear','canjear_joined','sorteo','sorteo_joined','premios_todos','premios_todos_joined','premios_excl','premios_canj','temu_detail','toast_pill','cip_code','checkout_0','checkout_10','checkout_20','review_0','review_10','review_20','success_0','success_10','success_20','stores','howitworks','challenge','act','act_detail','home_tx','home_tx_detail','code_fifa']
  .forEach(n => { const i = new Image(); i.src = `img/${n}.webp`; if (i.decode) i.decode().catch(() => {}); });

fit();
const start = (location.hash || '').slice(1);
reset(S[start] && ['home','puntos','stores','cip_code'].includes(start) ? start : 'home', true);
</script>
</body>
</html>
